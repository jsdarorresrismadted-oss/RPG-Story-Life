version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rpg-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rpg_story_life
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: rpg-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rpg_story_life
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      GROQ_API_KEY: ${GROQ_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: rpg-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:3000/api
      VITE_SOCKET_URL: http://backend:3000
    depends_on:
      - backend

  admin:
    build:
      context: ./packages/admin
      dockerfile: Dockerfile
    container_name: rpg-admin
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: http://backend:3000/api
    depends_on:
      - backend

volumes:
  postgres_data: